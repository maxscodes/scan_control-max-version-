[package]
name = "scan_control"
version = "0.4.0"
edition = "2021"

[profile.dev]
incremental = true  # default, but set explicitly
codegen-units = 256 # faster recompile, slower runtime

[features]
v5e = ["nanonis-tcp/v5e"]

[dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }
env_logger = "0.11"
eframe = { workspace = true, features = ["wgpu"] }
egui = { workspace = true, features = ["mint", "bytemuck"] }
# egui-colorgradient = { path = "../egui-colorgradient/egui-colorgradient" }
glam = { workspace = true, features = ["mint", "bytemuck"] }
mint = "0.5.9"
itertools.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.18", features = ["v4"] }
image-compute = { path = "crates/image-compute" }
sxmfile = { path = "crates/sxmfile" }
notify-typed = { path = "crates/notify-typed" }
filetree = { path = "crates/filetree" }
wgpu = { workspace = true, default-features = false, features = ["wgsl"] }
bytemuck.workspace = true
eyre.workspace = true
tracing.workspace = true
smol.workspace = true
egui-file-dialog = "0.11.0"
egui_plot = "0.33"
egui_extras = { version = "0.32", features = ["image"] }
id_tree = "1.8.0"
thiserror = "2.0.17"
borrow = "2.0.0"
# nanonis-tcp = { git = "https://github.com/Brad-Hesson/nanonis-tcp"}
nanonis-tcp = { path = "../nanonis-tcp" }
parking_lot = "0.12.5"
image.workspace = true
nalgebra = { version = "0.34.2", features = ["convert-glam032"]}
float-ord = "0.3.2"
gdsr = "0.0.1-alpha.3"
crossbeam = "0.8.4"
rfd = "0.17.2"
directories = "6.0.0"
redb = { version = "4.0.0", features = ["uuid"] }
tempfile = "3.27.0"
num_enum.workspace = true
time-fmt = "0.3.8"
time = "0.3.47"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Console"] }

[build-dependencies]
winresource = "0.1.31"
wgsl_to_wgpu.workspace = true

[dev-dependencies]
pollster = "0.4.0"

[workspace]
members = [
    "crates/sxmfile",
    "crates/image-compute",
    "crates/notify-typed",
    "crates/filetree",
]

[workspace.dependencies]
num_enum = "0.7.6"
image = "0.25.10"
bytemuck = "1.20"
itertools = "0.14"
wgpu = { version = "25.0", default-features = false } # need to use 25.0 because of egui
wgsl_to_wgpu = "0.15.0" # latest version that uses wgpu 25.0
eyre = "0.6"
tracing = "0.1"
smol = "2.0.2"
tracing-subscriber = "0.3"
glam = "0.32"
eframe = "0.32"
egui = "0.32"
